name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 13.232.38.226
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/devops-app

            git pull origin main

            docker-compose down

            docker-compose up -d --build
